
<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Invio Email</title>

<style>


* {
    box-sizing: border-box;
}

body {
    background: #000;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 10px;
}

.contenitore {
    background: #404040;
    max-width: 450px;
    margin: auto;
    padding: 14px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
    color: white;
    font-size: 17px;
    margin: 0 0 12px 0;
}

label {
    display: block;
    font-weight: bold;
    font-size: 11px;
    margin-top: 7px;
    color: white;
}

input,
textarea {
    width: 100%;
    padding: 6px 8px;
    margin-top: 3px;
    border: 1px solid #bbb;
    border-radius: 4px;
    font-size: 11px;
}

textarea {
    resize: vertical;
    min-height: 65px;
    height: 65px;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #0f86fc;
}

.password-container {
    display: flex;
    gap: 5px;
}

.password-container input {
    flex: 1;
}

.mostra {
    width: 65px;
    margin-top: 3px;
    border: none;
    background: #ddd;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
}

button.invia {
    width: 100%;
    background: #0f86fc;
    color: white;
    border: none;
    padding: 9px;
    margin-top: 12px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

button.invia:hover {
    background: #086acb;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

#risultato {
    text-align: center;
    margin-top: 8px;
    font-size: 12px;
    font-weight: bold;
}

.nota {
    font-size: 9px;
    color: #ccc;
    margin: 3px 0;
}


</style>

</head>

<body>

<div class="contenitore">

<h2>INVIO EMAIL</h2>

<form id="emailForm">

<label>MITTENTE:</label>

<input
    type="email"
    name="mittente"
    placeholder="mittente@gmail.com"
    required
    autocomplete="email"
>

<label>PASSWORD APPLICATIVA:</label>

<div class="password-container">
<button type="button" onclick="testRender()">
    TEST RENDER
</button>
<input
    type="password"
    name="password"
    placeholder="Password Gmail"
    required
    autocomplete="off"
>

<button
    type="button"
    class="mostra"
    onclick="mostraPassword()"
>
Mostra
</button>

</div>

<p class="nota">
Utilizzare la password applicativa Gmail.
</p>

<label>DESTINATARIO:</label>

<input
    type="email"
    name="destinatario"
    placeholder="destinatario@email.it"
    required
>

<label>OGGETTO:</label>

<input
    type="text"
    name="oggetto"
    placeholder="Oggetto email"
    required
>

<label>CONTENUTO:</label>

<textarea
    name="contenuto"
    placeholder="Scrivi il messaggio..."
    required
></textarea>

<label>ALLEGATO PDF:</label>

<input
    type="file"
    name="allegato"
    accept=".pdf,application/pdf"
>

<button
    type="submit"
    class="invia"
    id="pulsanteInvia"
>
INVIA EMAIL
</button>

</form>

<p id="risultato"></p>

</div>


<script>
async function testRender() {

    const risultato = document.getElementById("risultato");

    risultato.textContent = "Connessione in corso...";

    try {

        const risposta = await fetch(
            "https://invio-email.onrender.com/test",
            {
                method: "POST"
            }
        );

        const dati = await risposta.json();

        risultato.textContent = dati.stato;

    } catch (errore) {

        risultato.textContent = "ERRORE: " + errore.message;

    }
}
    
// Mostra o nasconde la password

function mostraPassword() {

    const campo = document.querySelector(
        '[name="password"]'
    );

    const pulsante = document.querySelector(
        '.mostra'
    );

    if (campo.type === "password") {

        campo.type = "text";
        pulsante.textContent = "Nascondi";

    } else {

        campo.type = "password";
        pulsante.textContent = "Mostra";

    }

}


// Invio email

document.getElementById("emailForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const form = this;

    const risultato = document.getElementById(
        "risultato"
    );

    const pulsante = document.getElementById(
        "pulsanteInvia"
    );

    // Controllo allegato

    const allegato = form.elements["allegato"].files[0];

    if (allegato) {

        if (!allegato.name.toLowerCase().endsWith(".pdf")) {

            risultato.style.color = "red";
            risultato.textContent = "Selezionare un file PDF.";
            return;

        }

        if (allegato.size > 9 * 1024 * 1024) {

            risultato.style.color = "red";
            risultato.textContent = "PDF troppo grande (max 9 MB).";
            return;

        }

    }

    // Preparazione invio

    const dati = new FormData(form);

    pulsante.disabled = true;
    pulsante.textContent = "INVIO IN CORSO...";

    risultato.style.color = "#555";
    risultato.textContent = "Attendere, invio email...";

    try {

        const risposta = await fetch(
            "https://invio-email.onrender.com/invia",
            {
                method: "POST",
                body: dati
            }
        );

        const risultatoJson = await risposta.json();

        if (!risposta.ok) {

            throw new Error(
                risultatoJson.errore || "Errore durante l'invio"
            );

        }

        risultato.style.color = "green";

        risultato.textContent =
            "Email inviata correttamente!";

        // Pulisce i campi dopo l'invio

        form.reset();

    } catch (errore) {

        risultato.style.color = "red";

        risultato.textContent =
            "ERRORE: " + errore.message;

    } finally {

        pulsante.disabled = false;
        pulsante.textContent = "INVIA EMAIL";

    }

});

</script>

</body>
</html>
