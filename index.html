
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elenco prodotti</title>

    <link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
          rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
        }

        .comandi {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        #stato {
            margin: 12px 0;
            padding: 10px;
            background: #f2f2f2;
        }

        .contenitore-griglie {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
            align-items: start;
            margin-top: 20px;
        }

        .pannello {
            min-width: 0;
        }

        #grigliaProdotti,
        #grigliaDettagli {
            width: 100%;
        }

        h3 {
            margin-top: 0;
        }

        @media (max-width: 700px) {
            body {
                margin: 12px;
            }

            .contenitore-griglie {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h2>Elenco prodotti</h2>

    <label for="fileXML">Carica file XML:</label>
    <input type="file" id="fileXML" accept=".xml">

    <div class="comandi">
        <button type="button" id="aggiungi">Aggiungi prodotto</button>
        <button type="button" id="elimina">Elimina selezionati</button>
        <button type="button" id="visualizza">Visualizza prodotto</button>
        <button type="button" id="esporta">Esporta XML modificato</button>
<a href="gestione_mensilita.html">Vai alla pagina gestione_mensilita.html</a>
    </div>

    <div id="stato">Seleziona un file XML.</div>

    <div class="contenitore-griglie">

        <div class="pannello">
            <h3>Elenco prodotti</h3>
            <p>Seleziona una riga per visualizzarne i dettagli.</p>
            <div id="grigliaProdotti"></div>
        </div>

        <div class="pannello">
            <h3>Dettagli prodotto</h3>
            <div id="grigliaDettagli"></div>
        </div>

    </div>

<script>
"use strict";

// ======================================================
// VARIABILI
// ======================================================

const inputFile = document.getElementById("fileXML");
const stato = document.getElementById("stato");

let datiProdotti = [];
let idSelezionato = null;

// ======================================================
// PRIMA GRIGLIA: ID E NOME
// ======================================================

const tabellaProdotti = new Tabulator("#grigliaProdotti", {
    height: "450px",
    layout: "fitColumns",
    index: "id",
    selectableRows: 1,
    placeholder: "Carica un file XML.",

    columns: [
        {
            title: "ID",
            field: "id",
            width: 80,
            headerSort: true
        },
        {
            title: "Nome",
            field: "nome",
            editor: "input",
            headerSort: true
        }
    ],

    data: []
});

// ======================================================
// SECONDA GRIGLIA: MARCA, QUANTITÀ, PREZZO
// ======================================================

const tabellaDettagli = new Tabulator("#grigliaDettagli", {
    height: "450px",
    layout: "fitColumns",
    index: "id",
    placeholder: "Seleziona un prodotto a sinistra.",

    columns: [
        {
            title: "ID",
            field: "id",
            visible: false
        },
        {
            title: "Marca",
            field: "marca",
            editor: "input"
        },
        {
            title: "Quantità",
            field: "quantita",
            editor: "number",
            hozAlign: "right",
            validator: ["numeric", "min:0"]
        },
        {
            title: "Prezzo",
            field: "prezzo",
            editor: "number",
            hozAlign: "right",
            validator: ["numeric", "min:0"]
        }
    ],

    data: []
});

// ======================================================
// FUNZIONI DI SUPPORTO
// ======================================================

function trovaProdotto(id) {
    return datiProdotti.find(
        p => String(p.id) === String(id)
    );
}

function leggiTesto(elemento, nomeTag) {
    for (const figlio of elemento.children) {
        if (figlio.tagName === nomeTag) {
            return figlio.textContent.trim();
        }
    }
    return "";
}

function numeroValido(valore) {
    if (valore === "" || valore === null ||
        valore === undefined) {
        return 0;
    }

    const numero = Number(valore);
    return Number.isFinite(numero) ? numero : 0;
}

function aggiornaDato(id, campo, valore) {
    const prodotto = trovaProdotto(id);

    if (prodotto) {
        prodotto[campo] = valore;
    }
}

async function aggiornaDettagli(prodotto) {
    if (!prodotto) {
        idSelezionato = null;
        await tabellaDettagli.clearData();
        return;
    }

    idSelezionato = String(prodotto.id);

    await tabellaDettagli.replaceData([{
        id: prodotto.id,
        marca: prodotto.marca,
        quantita: prodotto.quantita,
        prezzo: prodotto.prezzo
    }]);
}

// ======================================================
// MODIFICA NOME NELLA PRIMA GRIGLIA
// ======================================================

tabellaProdotti.on("cellEdited", function (cella) {
    const campo = cella.getField();
    const riga = cella.getRow().getData();
    const valore = cella.getValue();

    if (campo === "nome") {
        aggiornaDato(riga.id, "nome", valore);
        stato.textContent = "Nome aggiornato.";
    }
});

// ======================================================
// MODIFICA DETTAGLI NELLA SECONDA GRIGLIA
// ======================================================

tabellaDettagli.on("cellEdited", function (cella) {
    const riga = cella.getRow().getData();
    const campo = cella.getField();
    let valore = cella.getValue();

    if (campo === "quantita" || campo === "prezzo") {
        valore = numeroValido(valore);
        cella.setValue(valore, true);
    }

    aggiornaDato(riga.id, campo, valore);
    stato.textContent = "Dettagli aggiornati.";
});

// ======================================================
// SELEZIONE PRODOTTO
// ======================================================

tabellaProdotti.on("rowSelected", async function (riga) {
    const prodotto = trovaProdotto(riga.getData().id);
    await aggiornaDettagli(prodotto);
});

tabellaProdotti.on("rowDeselected", async function () {
    if (tabellaProdotti.getSelectedRows().length === 0) {
        await aggiornaDettagli(null);
    }
});

// ======================================================
// CARICAMENTO XML
// ======================================================

inputFile.addEventListener("change", async function () {
    const file = this.files[0];
    if (!file) return;

    try {
        const testo = await file.text();

        const xml = new DOMParser().parseFromString(
            testo,
            "application/xml"
        );

        if (xml.querySelector("parsererror")) {
            throw new Error("Il file XML non è valido.");
        }

        const elementi = Array.from(
            xml.getElementsByTagName("prodotto")
        );

        const nuoviDati = elementi.map(prodotto => ({
            id: prodotto.getAttribute("id") ?? "",
            nome: leggiTesto(prodotto, "nome"),
            marca: leggiTesto(prodotto, "marca"),
            quantita:
                leggiTesto(prodotto, "quantità") ||
                leggiTesto(prodotto, "quantita"),
            prezzo: leggiTesto(prodotto, "prezzo")
        }));

        const ids = nuoviDati.map(p => String(p.id));

        if (ids.some(id => id.trim() === "")) {
            throw new Error("Sono presenti prodotti senza ID.");
        }

        if (new Set(ids).size !== ids.length) {
            throw new Error("Sono presenti ID duplicati.");
        }

        nuoviDati.forEach(p => {
            p.quantita = numeroValido(p.quantita);
            p.prezzo = numeroValido(p.prezzo);
        });

        datiProdotti = nuoviDati;
        idSelezionato = null;

        await tabellaDettagli.clearData();

        await tabellaProdotti.replaceData(
            datiProdotti.map(p => ({
                id: p.id,
                nome: p.nome
            }))
        );

        stato.textContent =
            "File: " + file.name +
            " | Prodotti caricati: " + datiProdotti.length;

    } catch (errore) {
        stato.textContent = "Errore: " + errore.message;
    }
});

// ======================================================
// AGGIUNGI PRODOTTO
// ======================================================

document.getElementById("aggiungi").addEventListener(
    "click",
    async function () {
        const numeri = datiProdotti.map(
            p => Number(p.id) || 0
        );

        const nuovoId = String(Math.max(0, ...numeri) + 1);

        const prodotto = {
            id: nuovoId,
            nome: "Nuovo prodotto",
            marca: "",
            quantita: 0,
            prezzo: 0
        };

        datiProdotti.push(prodotto);

        await tabellaProdotti.addRow({
            id: prodotto.id,
            nome: prodotto.nome
        }, true);

        const riga = tabellaProdotti.getRow(nuovoId);

        if (riga) {
            riga.select();
        }

        stato.textContent = "Nuovo prodotto aggiunto.";
    }
);

// ======================================================
// ELIMINA PRODOTTI SELEZIONATI
// ======================================================

document.getElementById("elimina").addEventListener(
    "click",
    async function () {
        const selezionati = tabellaProdotti.getSelectedRows();

        if (selezionati.length === 0) {
            alert("Seleziona almeno un prodotto da eliminare.");
            return;
        }

        if (!confirm(
            "Vuoi eliminare " + selezionati.length + " prodotto/i?"
        )) {
            return;
        }

        const ids = selezionati.map(
            r => String(r.getData().id)
        );

        datiProdotti = datiProdotti.filter(
            p => !ids.includes(String(p.id))
        );

        for (const riga of selezionati) {
            await riga.delete();
        }

        await aggiornaDettagli(null);
        stato.textContent = "Prodotti eliminati.";
    }
);

// ======================================================
// MSGBOX: VISUALIZZA TUTTI I DATI
// ======================================================

document.getElementById("visualizza").addEventListener(
    "click",
    function () {
        if (idSelezionato === null) {
            alert("Seleziona prima un prodotto nella griglia sinistra.");
            return;
        }

        const prodotto = trovaProdotto(idSelezionato);

        if (!prodotto) {
            alert("Prodotto non trovato.");
            return;
        }

        const messaggio =
            "DETTAGLIO PRODOTTO\n" +
            "========================\n\n" +
            "ID: " + prodotto.id + "\n" +
            "Nome: " + prodotto.nome + "\n" +
            "Marca: " + prodotto.marca + "\n" +
            "Quantità: " + prodotto.quantita + "\n" +
            "Prezzo: " +
            numeroValido(prodotto.prezzo).toLocaleString("it-IT", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + " €";

        alert(messaggio);
    }
);

// ======================================================
// ESPORTAZIONE XML
// ======================================================

document.getElementById("esporta").addEventListener(
    "click",
    async function () {
        // Sincronizza i nomi dalla prima griglia.
        for (const riga of tabellaProdotti.getData()) {
            aggiornaDato(riga.id, "nome", riga.nome);
        }

        // Sincronizza i dettagli dalla seconda griglia.
        for (const riga of tabellaDettagli.getData()) {
            aggiornaDato(riga.id, "marca", riga.marca);
            aggiornaDato(
                riga.id,
                "quantita",
                numeroValido(riga.quantita)
            );
            aggiornaDato(
                riga.id,
                "prezzo",
                numeroValido(riga.prezzo)
            );
        }

        const doc = document.implementation.createDocument(
            "",
            "prodotti",
            null
        );

        const radice = doc.documentElement;

        for (const dato of datiProdotti) {
            const prodotto = doc.createElement("prodotto");
            prodotto.setAttribute("id", dato.id ?? "");

            function aggiungiElemento(nome, valore) {
                const elemento = doc.createElement(nome);
                elemento.textContent = valore ?? "";
                prodotto.appendChild(elemento);
            }

            aggiungiElemento("nome", dato.nome);
            aggiungiElemento("marca", dato.marca);
            aggiungiElemento("quantità", dato.quantita);
            aggiungiElemento("prezzo", dato.prezzo);

            radice.appendChild(prodotto);
        }

        const serializer = new XMLSerializer();

        const contenuto =
            '<?xml version="1.0" encoding="UTF-8"?>\n' +
            serializer.serializeToString(doc);

        const blob = new Blob(
            [contenuto],
            { type: "application/xml;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "prodotti_modificati.xml";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        stato.textContent =
            "Esportazione completata: prodotti_modificati.xml";
    }
);
</script>

</body>
</html>
