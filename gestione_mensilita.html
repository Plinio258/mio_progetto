<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestione mensilità e spese</title>
<link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:25px;color:#222}.comandi{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}button{padding:8px 12px;cursor:pointer}#stato{margin:12px 0;padding:10px;background:#f2f2f2}.contenitore{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;align-items:start;margin-top:20px}.pannello{min-width:0}#grigliaMensilita,#grigliaSpese{width:100%}h3{margin-top:0}.nota{font-size:.92em;color:#555}@media(max-width:800px){body{margin:12px}.contenitore{grid-template-columns:1fr}}
</style>
</head>
<body>
<h2>Gestione mensilità e spese</h2>
<label for="fileXML">Carica file XML:</label> <input type="file" id="fileXML" accept=".xml,text/xml">
<div class="comandi">
<button type="button" id="aggiungiMese">Aggiungi mensilità</button>
<button type="button" id="eliminaMese">Elimina mensilità selezionata</button>
<button type="button" id="aggiungiSpesa">Aggiungi riga di spesa</button>
<button type="button" id="eliminaSpese">Elimina spese selezionate</button>
<button type="button" id="visualizza">Visualizza mensilità</button>
<button type="button" id="esporta">Esporta XML modificato</button>
</div>
<div id="stato">Seleziona un file XML.</div>
<div class="contenitore">
 <section class="pannello"><h3>Mensilità</h3><p class="nota">Seleziona una mensilità per visualizzarne le spese. Il nome è modificabile.</p><div id="grigliaMensilita"></div></section>
 <section class="pannello"><h3>Spese della mensilità selezionata</h3><p class="nota">Puoi modificare direttamente data, descrizione, importo e categoria.</p><div id="grigliaSpese"></div></section>
</div>
<script>
'use strict';
const inputFile=document.getElementById('fileXML');
const stato=document.getElementById('stato');
let mensilita=[];
let idMeseSelezionato=null;
let prossimoIdSpesa=1;

const tabellaMensilita=new Tabulator('#grigliaMensilita',{
 height:'460px',layout:'fitColumns',index:'id',selectableRows:1,placeholder:'Carica un file XML.',
 columns:[
  {title:'ID',field:'id',width:70,headerSort:true},
  {title:'Mese / anno',field:'nome',editor:'input',headerSort:true}
 ],data:[]
});
const tabellaSpese=new Tabulator('#grigliaSpese',{
 height:'460px',layout:'fitColumns',index:'uid',selectableRows:true,placeholder:'Seleziona una mensilità.',
 columns:[
  {title:'Riga XML',field:'tag',width:95,editable:false},
  {title:'Data',field:'data',editor:'input',width:115,validator:[{type:'regex',parameters:'^$|^\\d{2}/\\d{2}/\\d{4}$'}]},
  {title:'Descrizione',field:'descrizione',editor:'input',minWidth:160},
  {title:'Importo',field:'importo',editor:'number',hozAlign:'right',width:110,validator:['numeric']},
  {title:'Cat.',field:'cat',editor:'input',width:75}
 ],data:[]
});
function trovaMese(id){return mensilita.find(m=>String(m.id)===String(id));}
function directText(el){return Array.from(el.childNodes).filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>n.nodeValue).join('').trim();}
function testoFiglio(el,nome){const child=Array.from(el.children).find(c=>c.tagName===nome);return child?child.textContent.trim():'';}
function aggiornaStato(t){stato.textContent=t;}
function prossimoTag(righe){let max=0;for(const r of righe){const m=String(r.tag).match(/^riga_(\d+)$/);if(m)max=Math.max(max,Number(m[1]));}return 'riga_'+(max+1);}
function nuovoUid(){return 's'+(prossimoIdSpesa++);}
function normalizzaImporto(v){if(v===null||v===undefined||String(v).trim()==='')return '';const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:String(v);}
async function mostraSpese(mese){
 if(!mese){idMeseSelezionato=null;await tabellaSpese.replaceData([]);return;}
 idMeseSelezionato=String(mese.id);
 await tabellaSpese.replaceData(mese.righe.map(r=>({...r})));
}
function sincronizzaRighe(mese){if(!mese)return;const correnti=tabellaSpese.getData();mese.righe=correnti.map(r=>({...r,importo:normalizzaImporto(r.importo)}));}
function sincronizzaMesi(){for(const r of tabellaMensilita.getData()){const m=trovaMese(r.id);if(m)m.nome=r.nome;}}
tabellaMensilita.on('cellEdited',c=>{const r=c.getRow().getData();const m=trovaMese(r.id);if(m)m.nome=r.nome;aggiornaStato('Nome della mensilità aggiornato.');});
tabellaMensilita.on('rowSelected',async r=>{const m=trovaMese(r.getData().id);await mostraSpese(m);aggiornaStato(m?'Mensilità selezionata: '+m.nome:'');});
tabellaMensilita.on('rowDeselected',async()=>{if(tabellaMensilita.getSelectedRows().length===0){idMeseSelezionato=null;await tabellaSpese.replaceData([]);}});
tabellaSpese.on('cellEdited',c=>{const row=c.getRow().getData();if(row.data && !/^\d{2}\/\d{2}\/\d{4}$/.test(row.data)){aggiornaStato('Attenzione: usa il formato data gg/mm/aaaa.');return;}const m=trovaMese(idMeseSelezionato);if(m)sincronizzaRighe(m);aggiornaStato('Riga di spesa aggiornata.');});
inputFile.addEventListener('change',async function(){const file=this.files&&this.files[0];if(!file)return;try{
 const testo=await file.text();const xml=new DOMParser().parseFromString(testo,'application/xml');if(xml.querySelector('parsererror'))throw new Error('Il file XML non è valido.');
 const root=xml.documentElement;if(root.tagName!=='elenco_mensilita')throw new Error('La radice XML deve essere <elenco_mensilita>.');
 const nuovi=Array.from(root.children).filter(e=>e.tagName==='mese_anno').map(el=>{
  const id=el.getAttribute('id')||'';const nome=directText(el);const righe=Array.from(el.children).filter(c=>/^riga_\d+$/.test(c.tagName)).map(r=>({uid:nuovoUid(),tag:r.tagName,data:testoFiglio(r,'data'),descrizione:testoFiglio(r,'descrizione'),importo:normalizzaImporto(testoFiglio(r,'importo')),cat:testoFiglio(r,'cat')}));
  return {id,nome,righe};
 });
 const ids=nuovi.map(m=>String(m.id));if(ids.some(x=>!x))throw new Error('Sono presenti mensilità senza ID.');if(new Set(ids).size!==ids.length)throw new Error('Sono presenti ID di mensilità duplicati.');
 mensilita=nuovi;idMeseSelezionato=null;await tabellaSpese.replaceData([]);await tabellaMensilita.replaceData(mensilita.map(m=>({id:m.id,nome:m.nome})));
 aggiornaStato('File: '+file.name+' | Mensilità caricate: '+mensilita.length+' | Righe di spesa: '+mensilita.reduce((n,m)=>n+m.righe.length,0));
 }catch(e){aggiornaStato('Errore: '+e.message);}});
document.getElementById('aggiungiMese').addEventListener('click',async()=>{
 sincronizzaMesi();const ids=mensilita.map(m=>Number(m.id)).filter(Number.isFinite);const id=String(Math.max(0,...ids)+1);const mese={id,nome:'NUOVO MESE',righe:[]};mensilita.push(mese);await tabellaMensilita.addRow({id,nome:mese.nome},true);const row=tabellaMensilita.getRow(id);if(row)row.select();aggiornaStato('Nuova mensilità aggiunta. Modifica il nome nella griglia.');
});
document.getElementById('eliminaMese').addEventListener('click',async()=>{
 const selected=tabellaMensilita.getSelectedRows();if(!selected.length){alert('Seleziona una mensilità da eliminare.');return;}const r=selected[0].getData();const m=trovaMese(r.id);if(!confirm('Eliminare la mensilità '+(m?.nome||r.id)+' e tutte le sue spese?'))return;mensilita=mensilita.filter(x=>String(x.id)!==String(r.id));await selected[0].delete();idMeseSelezionato=null;await tabellaSpese.replaceData([]);aggiornaStato('Mensilità eliminata.');
});
document.getElementById('aggiungiSpesa').addEventListener('click',async()=>{
 const m=trovaMese(idMeseSelezionato);if(!m){alert('Seleziona prima una mensilità.');return;}sincronizzaRighe(m);const tag=prossimoTag(m.righe);const r={uid:nuovoUid(),tag,data:'',descrizione:'',importo:'',cat:''};m.righe.push(r);await tabellaSpese.addRow(r,true);aggiornaStato('Riga di spesa aggiunta ('+tag+').');
});
document.getElementById('eliminaSpese').addEventListener('click',async()=>{
 const m=trovaMese(idMeseSelezionato);const selected=tabellaSpese.getSelectedRows();if(!m){alert('Seleziona prima una mensilità.');return;}if(!selected.length){alert('Seleziona almeno una riga di spesa da eliminare.');return;}if(!confirm('Eliminare '+selected.length+' riga/e di spesa?'))return;const uids=selected.map(r=>String(r.getData().uid));m.righe=m.righe.filter(r=>!uids.includes(String(r.uid)));for(const r of selected)await r.delete();aggiornaStato('Righe di spesa eliminate.');
});
document.getElementById('visualizza').addEventListener('click',()=>{
 sincronizzaMesi();const m=trovaMese(idMeseSelezionato);if(!m){alert('Seleziona prima una mensilità.');return;}sincronizzaRighe(m);const righe=m.righe.map(r=>`${r.tag}\n  Data: ${r.data}\n  Descrizione: ${r.descrizione}\n  Importo: ${r.importo}\n  Categoria: ${r.cat}`).join('\n\n');alert(`MENSILITÀ: ${m.nome}\nID: ${m.id}\n\n${righe||'Nessuna riga di spesa.'}`);
});
document.getElementById('esporta').addEventListener('click',()=>{
 sincronizzaMesi();const mSel=trovaMese(idMeseSelezionato);if(mSel)sincronizzaRighe(mSel);
 const doc=document.implementation.createDocument('','elenco_mensilita',null);const root=doc.documentElement;
 for(const m of mensilita){const me=doc.createElement('mese_anno');me.setAttribute('id',m.id);me.appendChild(doc.createTextNode((m.nome||'')+'\n'));
  for(const r of m.righe){const re=doc.createElement(/^riga_\d+$/.test(r.tag)?r.tag:prossimoTag(m.righe));for(const [tag,val] of [['data',r.data],['descrizione',r.descrizione],['importo',r.importo],['cat',r.cat]]){const el=doc.createElement(tag);el.textContent=val??'';re.appendChild(el);}me.appendChild(re);me.appendChild(doc.createTextNode('\n'));}
  root.appendChild(me);root.appendChild(doc.createTextNode('\n'));
 }
 const contenuto='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+new XMLSerializer().serializeToString(doc);
 const blob=new Blob([contenuto],{type:'application/xml;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='elenco_mensilita_modificato.xml';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);aggiornaStato('Esportazione completata: elenco_mensilita_modificato.xml');
});
</script>
</body>
</html>
