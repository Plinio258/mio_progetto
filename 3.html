
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Quotazioni</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 25px;
    background-color: #f4f6f9;
}

#borsa {
    margin-top: 20px;
    background: white;
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 2px 8px #00000012;
    max-width: 850px;
}

#borsa h2 {
    font-size: 18px;
    color: #263238;
    margin-top: 0;
    margin-bottom: 12px;
}

.azioni {
    width: auto;
    border-collapse: collapse;
    background: white;
    font-size: 11px;
}

.azioni th {
    padding: 5px 7px;
    line-height: 14px;
    font-size: 10px;
    font-weight: bold;
    color: white;
    background-color: rgb(38, 50, 56);
    text-align: left;
    white-space: nowrap;
}

.azioni td {
    padding: 4px 7px;
    line-height: 14px;
    font-size: 11px;
    background: #e8f1fa;
    border-bottom: 1px solid #ddd;
    white-space: nowrap;
}

.azioni tr:hover td {
    background-color: #c5e1e8;
}

.tabella-container {
    overflow-x: auto;
}

#aggiorna {
    background: #1976d2;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
}

#aggiorna:hover {
    background: #0d47a1;
}

#aggiorna:disabled {
    opacity: 0.6;
    cursor: wait;
}

#stato {
    color: #666;
    font-size: 13px;
    margin-top: 10px;
}

.positivo {
    color: rgb(0, 128, 0);
    font-weight: bold;
}

.negativo {
    color: rgb(208, 0, 0);
    font-weight: bold;
}

@media (max-width: 600px) {
    body {
        margin: 12px;
    }

    #borsa {
        padding: 12px;
    }

    .azioni {
        font-size: 13px;
        min-width: 450px;
    }
}
</style>
</head>

<body>

<div id="borsa">

    <h2>📈 Quotazioni di Borsa</h2>

    <button id="aggiorna" onclick="updateAll()">
        AGGIORNA QUOTAZIONI
    </button>

    <div class="tabella-container">

        <table class="azioni">

            <thead>
                <tr>
                    <th>Titolo</th>
                    <th>Prezzo</th>
                    <th>Variazione %</th>
                    <th>Ultimo aggiornamento</th>
                </tr>
            </thead>

            <tbody id="quote-table">
                <tr>
                    <td colspan="4">Caricamento quotazioni...</td>
                </tr>
            </tbody>

        </table>

    </div>

    <p id="stato">In attesa di aggiornamento...</p>

</div>

<script>

// INDIRIZZO SERVER PYTHON
const API_URL = "https://quotazioni-apple.onrender.com";

// FILE CONTENENTE TICKER E NOMI
const FILE_TITOLI = "elenco_titoli.txt";

let tickers = [];


// CARICAMENTO ELENCO TITOLI DAL FILE TXT
async function loadTickers() {

    const response = await fetch(FILE_TITOLI + "?t=" + Date.now());

    if (!response.ok) {
        throw new Error("Impossibile caricare elenco_titoli.txt");
    }

    const testo = await response.text();

    tickers = testo
        .split(/\r?\n/)
        .map(riga => riga.trim())
        .filter(riga => riga && !riga.startsWith("#"))
        .map(riga => {
            const separatore = riga.indexOf(",");

            if (separatore === -1) return null;

            return {
                symbol: riga.substring(0, separatore).trim(),
                name: riga.substring(separatore + 1).trim()
            };
        })
        .filter(ticker => ticker && ticker.symbol && ticker.name);

    if (tickers.length === 0) {
        throw new Error("Nessun titolo trovato nel file TXT");
    }
}


// CARICAMENTO SINGOLO TITOLO
async function updateTicker(ticker) {

    try {

        const response = await fetch(
            API_URL + "/quote/" + encodeURIComponent(ticker.symbol)
        );

        if (!response.ok) {
            throw new Error("Errore HTTP " + response.status);
        }

        const data = await response.json();

        const sign = data.change_pct >= 0 ? "+" : "";

        const changeClass =
            data.change_pct >= 0 ? "positivo" : "negativo";

        const price =
            Number(data.price).toFixed(2) + " " + data.currency;

        const percentage =
            sign + Number(data.change_pct).toFixed(2) + "%";

        const time = new Date(
            data.quote_time
        ).toLocaleString("it-IT", {
            timeZone: data.timezone
        });

        return `
            <tr>
                <td><strong>${ticker.name}</strong></td>
                <td><strong>${price}</strong></td>
                <td class="${changeClass}">${percentage}</td>
                <td>${time}</td>
            </tr>
        `;

    } catch (error) {

        return `
            <tr>
                <td><strong>${ticker.name}</strong></td>
                <td colspan="3" class="negativo">
                    Errore: ${error.message}
                </td>
            </tr>
        `;

    }
}


// AGGIORNA TUTTI I TITOLI
async function updateAll() {

    const table = document.getElementById("quote-table");
    const status = document.getElementById("stato");
    const button = document.getElementById("aggiorna");

    button.disabled = true;
    button.textContent = "AGGIORNAMENTO...";

    status.textContent = "Caricamento quotazioni...";

    try {

        // Carica l'elenco dei titoli dal file TXT
        await loadTickers();

        table.innerHTML = "";

        // Richieste in parallelo
        const results = await Promise.all(
            tickers.map(ticker => updateTicker(ticker))
        );

        table.innerHTML = results.join("");

        status.textContent =
            "Aggiornamento completato alle " +
            new Date().toLocaleTimeString("it-IT");

    } catch (error) {

        table.innerHTML = `
            <tr>
                <td colspan="4" class="negativo">
                    ${error.message}
                </td>
            </tr>
        `;

        status.textContent = "Errore durante l'aggiornamento.";

    } finally {

        button.disabled = false;
        button.textContent = "AGGIORNA QUOTAZIONI";

    }
}


// AVVIO AUTOMATICO
updateAll();


// AGGIORNAMENTO AUTOMATICO OGNI 300 SECONDI
setInterval(updateAll, 300000);

</script>

</body>
</html>
