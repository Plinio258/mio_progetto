<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Main Page</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 25px;
    background-color: #f4f6f9;
}

h2 {
    color: #263238;
    margin-bottom: 20px;
}

.comandi {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 350px;
    margin-top: 20px;
}

.comandi a {
    display: block;
    padding: 13px 18px;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    border-left: 5px solid;
    transition: 0.2s;
}

.comandi a:hover {
    transform: translateX(5px);
    filter: brightness(0.9);
}

.link1 { background: #1976d2; border-color: #0d47a1; }
.link2 { background: #00897b; border-color: #004d40; }
.link3 { background: #7b1fa2; border-color: #4a148c; }
.link4 { background: #ef6c00; border-color: #e65100; }
.link5 { background: #c62828; border-color: #8e0000; }
.link6 { background: #455a64; border-color: #263238; }


#borsa {
    margin-top: 20px;
    background: white;
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 2px 8px #00000012;
    max-width: 850px;
}

#borsa h2 {
    font-size: 18px;
    margin-top: 0;
    margin-bottom: 12px;
}

.azioni {
    width: auto;
    border-collapse: collapse;
    background: white;
    font-size: 11px;
}

.azioni th {
    padding: 5px 7px;
    line-height: 14px;
    font-size: 10px;
    font-weight: bold;
    color: white;
    background-color: rgb(38, 50, 56);
    text-align: left;
    white-space: nowrap;
}

.azioni td {
    padding: 4px 7px;
    line-height: 14px;
    font-size: 11px;
    background: #e8f1fa;
    border-bottom: 1px solid #ddd;
    white-space: nowrap;
}

.azioni tr:hover td {
    background-color: #c5e1e8;
}

.tabella-container {
    overflow-x: auto;
}

#aggiorna {
    padding: 8px 12px;
    font-size: 11px;
}

#stato {
    font-size: 11px;
    margin-top: 7px;
}


.positivo {
    color: rgb(0, 128, 0);
    font-weight: bold;
}

.negativo {
    color: rgb(208, 0, 0);
    font-weight: bold;
}

#aggiorna {
    background: #1976d2;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
}

#aggiorna:hover {
    background: #0d47a1;
}

#stato {
    color: #666;
    font-size: 13px;
    margin-top: 10px;
}

.tabella-container {
    overflow-x: auto;
}

@media (max-width: 600px) {

    body {
        margin: 12px;
    }

    .comandi {
        max-width: 100%;
    }

    #borsa {
        padding: 12px;
    }

    .azioni {
        font-size: 13px;
        min-width: 580px;
    }
}

</style>
</head>

<body>

<!-- SEZIONE QUOTAZIONI -->

<div id="borsa">

    <h2>📈 Quotazioni di Borsa</h2>

    <button id="aggiorna" onclick="updateAll()">
        AGGIORNA QUOTAZIONI
    </button>

    <div class="tabella-container">

        <table class="azioni">

            <thead>
                <tr>
                    <th>Titolo</th>
                    <th>Simbolo</th>
                    <th>Prezzo</th>
                    <th>Variazione</th>
                    <th>Variazione %</th>
                    <th>Ultimo aggiornamento</th>
                </tr>
            </thead>

            <tbody id="quote-table">

                <tr>
                    <td colspan="6">Caricamento quotazioni...</td>
                </tr>

            </tbody>

        </table>

    </div>

    <p id="stato">In attesa di aggiornamento...</p>

</div>


<script>

// INDIRIZZO SERVER PYTHON
const API_URL = "https://quotazioni-apple.onrender.com";

// ELENCO TITOLI
const tickers = [

    {symbol: "ISP.MI", name: "Intesa SanPaolo"},
    {symbol: "UCG.MI", name: "Unicredit"},
    {symbol: "STLAM.MI", name: "Stellantis"},
    {symbol: "SWDA.MI", name: "iShares Core MSCI World UCITS ETF USD (Acc) (SWDA)"},
    {symbol: "AEME.PA", name: "Amundi Core MSCI Emerging Markets UCITS ETF Accumulation"},
    {symbol: "FCT.MI", name: "Fincantieri"},
    {symbol: "SX7E.Z", name: "ESTX Banks I"},
    {symbol: "FTSEMIB.MI", name: "FTSE MIB"}
   

];


// CARICAMENTO SINGOLO TITOLO
async function updateTicker(ticker) {

    try {

        const response = await fetch(
            API_URL + "/quote/" + ticker.symbol
        );

        if (!response.ok) {
            throw new Error("Errore HTTP " + response.status);
        }

        const data = await response.json();

        const sign = data.change >= 0 ? "+" : "";

        const changeClass =
            data.change >= 0 ? "positivo" : "negativo";

        const price =
            data.price.toFixed(2) + " " + data.currency;

        const change =
            sign + data.change.toFixed(2);

        const percentage =
            sign + data.change_pct.toFixed(2) + "%";

        const time = new Date(
            data.quote_time
        ).toLocaleString("it-IT", {
            timeZone: data.timezone
        });

        return `
            <tr>
                <td><strong>${ticker.name}</strong></td>
                <td>${ticker.symbol}</td>
                <td><strong>${price}</strong></td>
                <td class="${changeClass}">${change}</td>
                <td class="${changeClass}">${percentage}</td>
                <td>${time}</td>
            </tr>
        `;

    } catch (error) {

        return `
            <tr>
                <td><strong>${ticker.name}</strong></td>
                <td>${ticker.symbol}</td>
                <td colspan="4" class="negativo">
                    Errore: ${error.message}
                </td>
            </tr>
        `;

    }

}


// AGGIORNA TUTTI I TITOLI
async function updateAll() {

    const table = document.getElementById("quote-table");
    const status = document.getElementById("stato");
    const button = document.getElementById("aggiorna");

    button.disabled = true;
    button.textContent = "AGGIORNAMENTO...";

    status.textContent = "Caricamento quotazioni...";

    table.innerHTML = "";

    try {

        // Richieste in parallelo
        const results = await Promise.all(
            tickers.map(ticker => updateTicker(ticker))
        );

        table.innerHTML = results.join("");

        status.textContent =
            "Aggiornamento completato alle " +
            new Date().toLocaleTimeString("it-IT");

    } finally {

        button.disabled = false;
        button.textContent = "AGGIORNA QUOTAZIONI";

    }

}


// AVVIO AUTOMATICO
updateAll();


// AGGIORNAMENTO AUTOMATICO OGNI 300 SECONDI
setInterval(updateAll, 300000);
</script>

</body>
</html>
