
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inserimento Dati</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 25px;
    background: #000;
}

h2 {
    color: white;
    font-size: 16px;
    margin: 0 0 12px;
}

/* CONTENITORE PRINCIPALE */

.contenitore-principale {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    width: 100%;
    max-width: 1600px;
    margin: 10px 0;
    padding: 5px;
    box-sizing: border-box;
    align-items: start;
}

/* CONTENITORE TABELLA */

#Elenco_Comandi {
    min-width: 0;
    width: 100%;
    box-sizing: border-box;
    background: #404040;
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 2px 8px #00000012;
}

/* TABELLA */

.tabella-container {
    overflow-x: auto;
}

.righe {
    width: 940px;
    table-layout: fixed;
    border-collapse: collapse;
    background: white;
    font-size: 11px;
}

.righe th {
    padding: 5px 7px;
    line-height: 14px;
    font-size: 11px;
    font-weight: normal;
    color: white;
    background: #263238;
    text-align: left;
    white-space: nowrap;
}

.righe td {
    padding: 3px 5px;
    height: 25px;
    box-sizing: border-box;
    background: #e8f1fa;
    border-bottom: 1px solid #ddd;
}

/* CAMPI INSERIMENTO */

.righe input {
    width: 100%;
    height: 23px;
    padding: 2px 5px;
    box-sizing: border-box;
    border: 1px solid transparent;
    border-radius: 2px;
    background: transparent;
    font-family: Arial, sans-serif;
    font-size: 11px;
    outline: none;
}

.righe input:focus {
    border: 1px solid #1976d2;
    background: white;
}

/* LARGHEZZA COLONNE */

.col-x {
    width: 100px;
}

.col-y {
    width: 100px;
}

.col-layer {
    width: 150px;
}

.col-l1 {
    width: 150px;
}

.col-l2 {
    width: 150px;
}


.col-tipo {
    width: 200px;
}

.col-testo {
    width: 200px;
}

.righe select {
    width: 100%;
    height: 23px;
    padding: 2px 4px;
    box-sizing: border-box;
    border: 1px solid transparent;
    border-radius: 2px;
    background: transparent;
    font-family: Arial, sans-serif;
    font-size: 11px;
    outline: none;
}

.righe select:focus {
    border: 1px solid #1976d2;
    background: white;
}

/* =================================
   PULSANTI
================================= */


#crea_dxf {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 19px;
    min-height: 19px;
    padding: 0 5px;
    margin: 3px 3px 6px 0;
    box-sizing: border-box;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 4px;
    font-family: Arial, sans-serif;
    font-size: 9px;
    line-height: 19px;
    font-weight: bold;
    cursor: pointer;
}

/* MOBILE */

@media (max-width: 650px) {

    body {
        margin: 10px;
    }

    .contenitore-principale {
        padding: 2px;
    }

    #Elenco_Comandi {
        padding: 8px;
    }

}

</style>
</head>

<body>

<div class="contenitore-principale">

    <div id="Elenco_Comandi">

        <h2>📈 Elenco Comandi</h2>
<button id="crea_dxf" onclick="crea_dxf()">CREA DXF</button>
        <div class="tabella-container">

            <table class="righe">

            <thead>
   <tr>
    <th class="col-tipo">Tipo</th>
    <th class="col-x">X</th>
    <th class="col-y">Y</th>
    <th class="col-l1">L1</th>
    <th class="col-l2">L2</th>
    <th class="col-layer">Layer</th>
    <th class="col-testo">Testo / Note</th>
</tr>
</thead>

                <tbody id="quote-table">
                </tbody>

            </table>

        </div>

    </div>

</div>

<script>



/* =================================
   ELENCO VOCI MENU
================================= */

const elencoTipi = [
    "LINEA",
    "CERCHIO",
    "RETTANGOLO",
    "RETTANGOLO ARROTONDATO",
    "POLILINEA",
    "TESTO"
];


/* =================================
   CREAZIONE AUTOMATICA DI 15 RIGHE
================================= */

const tbody = document.getElementById("quote-table");

for (let i = 0; i < 15; i++) {

    const riga = document.createElement("tr");

    const opzioni = elencoTipi.map(voce =>
        `<option value="${voce}">${voce}</option>`
    ).join("");

    riga.innerHTML = `
        <td>
            <select>
                <option value="">Seleziona</option>
                ${opzioni}
            </select>
        </td>

        <td><input type="text"></td>
        <td><input type="text"></td>
        <td><input type="text"></td>
        <td><input type="text"></td>
        <td><input type="text"></td>
<td><input type="text"></td>
    `;

    tbody.appendChild(riga);

}


/* =================================
   CREAZIONE FILE DXF
================================= */

async function crea_dxf() {

    let contenuto = "";
    let numeroEntita = 0;

    /* INTESTAZIONE DXF */

    contenuto += "0\nSECTION\n";
    contenuto += "2\nENTITIES\n";


    /* LETTURA TABELLA */

    const righe = document.querySelectorAll("#quote-table tr");

    for (const riga of righe) {

        const tipo = riga.cells[0].querySelector("select").value;

        const X = riga.cells[1].querySelector("input").value.trim();
        const Y = riga.cells[2].querySelector("input").value.trim();
        const L1 = riga.cells[3].querySelector("input").value.trim();
        const L2 = riga.cells[4].querySelector("input").value.trim();
        const Layer = riga.cells[5].querySelector("input").value.trim();
const Testo = riga.cells[6].querySelector("input").value;

        /* SALTA RIGHE VUOTE */

        if (tipo === "") continue;


        /* CONVERSIONE NUMERICA */

        const x = parseFloat(X.replace(",", "."));
        const y = parseFloat(Y.replace(",", "."));
        const l1 = parseFloat(L1.replace(",", "."));
        const l2 = parseFloat(L2.replace(",", "."));

        const layer = Layer || "0";


 /* =================================
   COMANDO LINEA
================================= */

if (tipo === "LINEA") {

    if (
        X === "" || Y === "" ||
        L1 === "" || L2 === "" ||
        ![x, y, l1, l2].every(Number.isFinite)
    ) {
        alert("Coordinate non valide nella riga " + riga.rowIndex);
        return;
    }

    scriviLinea(
        x, y, l1, l2, layer,
        testo => contenuto += testo
    );

    numeroEntita++;

}


/* =================================
   COMANDO CERCHIO
================================= */

else if (tipo === "CERCHIO") {

    if (
        X === "" || Y === "" ||
        !Number.isFinite(x) ||
        !Number.isFinite(y)
    ) {
        alert("Centro del cerchio non valido nella riga " + riga.rowIndex);
        return;
    }

    let raggio;

    if (L1 !== "") {

        raggio = parseFloat(L1.replace(",", "."));

    } else if (L2 !== "") {

        const diametro = parseFloat(L2.replace(",", "."));

        raggio = diametro / 2;

    } else {

        alert("Inserire il raggio in L1 oppure il diametro in L2. Riga " + riga.rowIndex);
        return;

    }

    if (!Number.isFinite(raggio) || raggio <= 0) {

        alert("Raggio o diametro non valido nella riga " + riga.rowIndex);
        return;

    }

    scriviCerchio(
        x, y, raggio, layer,
        testo => contenuto += testo
    );

    numeroEntita++;

}


/* =================================
   COMANDO RETTANGOLO
================================= */

else if (tipo === "RETTANGOLO") {

    if (
        X === "" || Y === "" ||
        L1 === "" || L2 === "" ||
        ![x, y, l1, l2].every(Number.isFinite)
    ) {
        alert("Valori non validi nella riga " + riga.rowIndex);
        return;
    }

    if (l1 <= 0 || l2 <= 0) {
        alert("Base e altezza devono essere maggiori di zero. Riga " + riga.rowIndex);
        return;
    }

    scriviRettangolo(
        x, y, l1, l2, layer,
        testo => contenuto += testo
    );

    numeroEntita++;

}


/* =================================
   COMANDO RETTANGOLO ARROTONDATO
================================= */

else if (tipo === "RETTANGOLO ARROTONDATO") {

    if (
        X === "" || Y === "" ||
        L1 === "" || L2 === "" ||
        ![x, y, l1, l2].every(Number.isFinite)
    ) {
        alert("Valori non validi nella riga " + riga.rowIndex);
        return;
    }

    // Raggio angoli dalla colonna Testo / Note
    const R = parseFloat(Testo.trim().replace(",", "."));

    if (!Number.isFinite(R) || R <= 0) {
        alert("Inserire un raggio valido nella colonna Testo / Note. Riga " + riga.rowIndex);
        return;
    }

    if (l1 <= 0 || l2 <= 0) {
        alert("Base e altezza devono essere maggiori di zero. Riga " + riga.rowIndex);
        return;
    }

    if (R > Math.min(l1, l2) / 2) {
        alert("Il raggio non può superare la metà del lato minore. Riga " + riga.rowIndex);
        return;
    }

    scriviRettangoloArrotondatoDXF(
        x,
        y,
        l1,
        l2,
        R,
        layer,
        testo => contenuto += testo
    );

    numeroEntita++;

}

/* =================================
   COMANDO POLILINEA
================================= */

else if (tipo === "POLILINEA") {

    if (X === "" || Y === "") {
        alert("Coordinate X e Y mancanti nella riga " + riga.rowIndex);
        return;
    }

    /* PARSING COORDINATE X */

    const coordinateX = X.split(";").map(valore =>
        parseFloat(valore.trim().replace(",", "."))
    );

    /* PARSING COORDINATE Y */

    const coordinateY = Y.split(";").map(valore =>
        parseFloat(valore.trim().replace(",", "."))
    );

    /* CONTROLLO NUMERO PUNTI */

    if (coordinateX.length !== coordinateY.length) {
        alert("Il numero di coordinate X e Y non coincide nella riga " + riga.rowIndex);
        return;
    }

    /* CONTROLLO COORDINATE */

    if (
        coordinateX.length < 2 ||
        !coordinateX.every(Number.isFinite) ||
        !coordinateY.every(Number.isFinite)
    ) {
        alert("Coordinate polilinea non valide nella riga " + riga.rowIndex);
        return;
    }

    /* CREAZIONE ARRAY PUNTI */

    const punti = coordinateX.map((valore, indice) => [
        valore,
        coordinateY[indice]
    ]);

    /* TIPO POLILINEA */

    const chiusa = L1.trim().toUpperCase() === "C";

    /* SCRITTURA POLILINEA */

    scriviPolilinea(
        punti,
        layer,
        chiusa,
        testo => contenuto += testo
    );

    numeroEntita++;

}


/* =================================
   COMANDO TESTO
================================= */

else if (tipo === "TESTO") {

    if (X === "" || Y === "" || L1 === "") {

        alert("Coordinate e altezza testo mancanti nella riga " + riga.rowIndex);
        return;

    }

    const altezza = parseFloat(L1.replace(",", "."));

    const rotazione = L2.trim() === ""
        ? 0
        : parseFloat(L2.replace(",", "."));

    if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        !Number.isFinite(altezza) ||
        !Number.isFinite(rotazione) ||
        altezza <= 0
    ) {

        alert("Parametri testo non validi nella riga " + riga.rowIndex);
        return;

    }

    if (Testo.trim() === "") {

        alert("Inserire il testo nella colonna Testo / Note. Riga " + riga.rowIndex);
        return;

    }

    scriviTestoDXF(
        x,
        y,
        Testo,
        layer,
        altezza,
        rotazione,
        testoDXF => contenuto += testoDXF
    );

    numeroEntita++;

}





/* =================================
   ALTRI COMANDI DA IMPLEMENTARE
================================= */

else {

    alert("Comando " + tipo + " non ancora implementato. Riga " + riga.rowIndex);
    return;

}
    }


    /* =================================
       CONTROLLO ENTITÀ GENERATE
    ================================= */

    if (numeroEntita === 0) {

        alert(
            "Nessuna entità DXF da generare.\n" +
            "Seleziona almeno un comando LINEA."
        );

        return;

    }


    /* =================================
       FINE FILE
    ================================= */

    contenuto += "0\nENDSEC\n";
    contenuto += "0\nEOF\n";


    /* CREAZIONE BLOB */

    const blob = new Blob(
        [contenuto],
        { type: "application/dxf;charset=utf-8" }
    );


    /* =================================
       SALVATAGGIO CHROME / EDGE
    ================================= */

    if (window.showSaveFilePicker) {

        try {

            const handle = await window.showSaveFilePicker({

                suggestedName: "Disegno.dxf",

                types: [{
                    description: "File DXF",
                    accept: {
                        "application/dxf": [".dxf"]
                    }
                }]

            });

            const writable = await handle.createWritable();

            await writable.write(blob);

            await writable.close();

            alert(
                "File DXF salvato correttamente!\n" +
                "Entità generate: " + numeroEntita
            );

        }

        catch (errore) {

            if (errore.name !== "AbortError") {

                alert("Errore salvataggio: " + errore.message);

            }

        }

    }


    /* =================================
       SALVATAGGIO FIREFOX
    ================================= */

    else {

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = "Disegno.dxf";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        setTimeout(() => {

            URL.revokeObjectURL(url);

        }, 2000);

        alert(
            "File DXF generato.\n" +
            "Entità generate: " + numeroEntita
        );

    }

}


  

/* =================================
   FUNZIONE LINEA
================================= */

function scriviLinea(x1, y1, x2, y2, layer, aggiungi) {

    aggiungi("0\n");
    aggiungi("LINE\n");

    /* LAYER */

    aggiungi("8\n");
    aggiungi(layer + "\n");

    /* PUNTO INIZIALE */

    aggiungi("10\n");
    aggiungi(x1 + "\n");

    aggiungi("20\n");
    aggiungi(y1 + "\n");

    aggiungi("30\n");
    aggiungi("0\n");

    /* PUNTO FINALE */

    aggiungi("11\n");
    aggiungi(x2 + "\n");

    aggiungi("21\n");
    aggiungi(y2 + "\n");

    aggiungi("31\n");
    aggiungi("0\n");

}

/* =================================
   FUNZIONE SCRITTURA CERCHIO
================================= */

function scriviCerchio(x, y, raggio, layer, aggiungi) {

    aggiungi("0\n");
    aggiungi("CIRCLE\n");

    /* LAYER */

    aggiungi("8\n");
    aggiungi(layer + "\n");

    /* CENTRO X */

    aggiungi("10\n");
    aggiungi(x + "\n");

    /* CENTRO Y */

    aggiungi("20\n");
    aggiungi(y + "\n");

    /* CENTRO Z */

    aggiungi("30\n");
    aggiungi("0\n");

    /* RAGGIO */

    aggiungi("40\n");
    aggiungi(raggio + "\n");

}




/* =================================
   FUNZIONE SCRITTURA POLILINEA DXF
   POLYLINE / VERTEX / SEQEND
================================= */

function scriviPolilinea(punti, layer, chiusa, aggiungi) {

    /* INIZIO POLILINEA */

    aggiungi("0\n");
    aggiungi("POLYLINE\n");

    aggiungi("8\n");
    aggiungi(layer + "\n");

    aggiungi("66\n");
    aggiungi("1\n");

    /* FLAG POLILINEA
       0 = APERTA
       1 = CHIUSA
    */

    aggiungi("70\n");
    aggiungi(chiusa ? "1\n" : "0\n");

    /* VERTICI */

    for (const punto of punti) {

        aggiungi("0\n");
        aggiungi("VERTEX\n");

        aggiungi("8\n");
        aggiungi(layer + "\n");

        aggiungi("10\n");
        aggiungi(punto[0] + "\n");

        aggiungi("20\n");
        aggiungi(punto[1] + "\n");

        aggiungi("30\n");
        aggiungi("0.0\n");

    }

    /* CHIUSURA SEQUENZA */

    aggiungi("0\n");
    aggiungi("SEQEND\n");

}




/* =================================
   FUNZIONE SCRITTURA RETTANGOLO
================================= */

function scriviRettangolo(x, y, base, altezza, layer, aggiungi) {

    const punti = [
        [x, y],
        [x + base, y],
        [x + base, y + altezza],
        [x, y + altezza]
    ];

    scriviPolilinea(
        punti,
        layer,
        true,
        aggiungi
    );

}


/* =================================
   FUNZIONE SCRITTURA TESTO DXF
================================= */

function scriviTestoDXF(
    x,
    y,
    testo,
    layer,
    altezza,
    rotazione,
    aggiungi
) {

    aggiungi("0\n");
    aggiungi("TEXT\n");

    /* LAYER */

    aggiungi("8\n");
    aggiungi(layer + "\n");

    /* LINE TYPE */

    aggiungi("6\n");
    aggiungi("CONTINUOUS\n");

    /* STILE TESTO */

    aggiungi("7\n");
    aggiungi("Stile_Font\n");

    /* PUNTO INSERIMENTO */

    aggiungi("10\n");
    aggiungi(x + "\n");

    aggiungi("20\n");
    aggiungi(y + "\n");

    aggiungi("30\n");
    aggiungi("0\n");

    /* ALTEZZA */

    aggiungi("40\n");
    aggiungi(altezza + "\n");

    /* ROTAZIONE */

    aggiungi("50\n");
    aggiungi(rotazione + "\n");

    /* STRINGA */

    aggiungi("1\n");
    aggiungi(testo + "\n");

}

/* =================================
   RETTANGOLO CON ANGOLI ARROTONDATI
   4 LINE + 4 ARC
================================= */

function scriviRettangoloArrotondatoDXF(
    xc, yc, L, H, R, layer, aggiungi
) {

    const x1 = xc - L / 2;
    const x2 = xc + L / 2;
    const y1 = yc - H / 2;
    const y2 = yc + H / 2;

    // LINEE ORIZZONTALI

    scriviLinea(
        x1 + R, y1,
        x2 - R, y1,
        layer, aggiungi
    );

    scriviLinea(
        x1 + R, y2,
        x2 - R, y2,
        layer, aggiungi
    );

    // LINEE VERTICALI

    scriviLinea(
        x1, y1 + R,
        x1, y2 - R,
        layer, aggiungi
    );

    scriviLinea(
        x2, y1 + R,
        x2, y2 - R,
        layer, aggiungi
    );

    // ARCHI ANGOLARI

    // Basso sinistra
    scriviArcoDXF(
        x1 + R, y1 + R,
        R, 180, 270,
        layer, aggiungi
    );

    // Basso destra
    scriviArcoDXF(
        x2 - R, y1 + R,
        R, 270, 360,
        layer, aggiungi
    );

    // Alto destra
    scriviArcoDXF(
        x2 - R, y2 - R,
        R, 0, 90,
        layer, aggiungi
    );

    // Alto sinistra
    scriviArcoDXF(
        x1 + R, y2 - R,
        R, 90, 180,
        layer, aggiungi
    );

}


/* =================================
   SCRITTURA ARCO DXF
================================= */

function scriviArcoDXF(
    xc, yc, R,
    angoloIniziale,
    angoloFinale,
    layer,
    aggiungi
) {

    aggiungi("0\n");
    aggiungi("ARC\n");

    // LAYER
    aggiungi("8\n");
    aggiungi(layer + "\n");

    // CENTRO X
    aggiungi("10\n");
    aggiungi(xc + "\n");

    // CENTRO Y
    aggiungi("20\n");
    aggiungi(yc + "\n");

    // CENTRO Z
    aggiungi("30\n");
    aggiungi("0\n");

    // RAGGIO
    aggiungi("40\n");
    aggiungi(R + "\n");

    // ANGOLO INIZIALE
    aggiungi("50\n");
    aggiungi(angoloIniziale + "\n");

    // ANGOLO FINALE
    aggiungi("51\n");
    aggiungi(angoloFinale + "\n");

}
</script>

</body>
</html>
